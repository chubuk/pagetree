<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageTree — Редактор страниц</title>
<link rel="stylesheet" href="vditor/index.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;background:#f5f5f5}
/* Header — как в mcp-is web/static/css/style.css:14-57 */
.header{background:#1a1a2e;color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;gap:32px;position:sticky;top:0;z-index:100;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.header__logo{font-size:18px;font-weight:700;white-space:nowrap;color:#fff!important;text-decoration:none}
.header__nav{display:flex;gap:4px}
.nav-link{color:#aaa;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:14px;transition:all 0.15s;white-space:nowrap}
.nav-link:hover,.nav-link.active{color:#fff;background:rgba(255,255,255,0.1)}
.header__user{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:#aaa}
.header__user .btn--sm{background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer;transition:all 0.15s}
.header__user .btn--sm:hover{background:rgba(255,255,255,0.2)}
.toolbar{background:#fff;border-bottom:1px solid #ddd;padding:.5rem 1rem;display:flex;gap:.5rem;align-items:center}
.toolbar button{padding:.4rem .8rem;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:.85rem}
.toolbar button:hover{background:#f0f0f0}
.toolbar button.primary{background:#1976d2;color:#fff;border-color:#1976d2}
.toolbar button.primary:hover{background:#1565c0}
.toolbar .sep{width:1px;height:1.5rem;background:#ddd;margin:0 .5rem}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden}
.sidebar h3{padding:.6rem .8rem;font-size:.85rem;color:#666;border-bottom:1px solid #eee;text-transform:uppercase}
.sidebar .tree{flex:1;overflow-y:auto;padding:.25rem 0}
.tree-item{padding:.35rem .8rem;cursor:pointer;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.4rem}
.tree-item:hover{background:#e3f2fd}
.tree-item.active{background:#bbdefb}
.tree-item .type{font-size:.7rem;padding:.1rem .3rem;border-radius:3px;background:#eee;color:#666}
.tree-item .type.page{background:#c8e6c9;color:#2e7d32}
.tree-item .type.news{background:#fff9c4;color:#f57f17}
.tree-item .type.orphan{background:#ffcdd2;color:#c62828}
.tree-item .actions{margin-left:auto;display:none;gap:.25rem}
.tree-item:hover .actions{display:flex}
.tree-item .actions button{padding:.1rem .3rem;font-size:.75rem;border:1px solid #ccc;background:#fff;border-radius:3px;cursor:pointer}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#vditor{flex:1;min-height:0}
.meta-panel{width:300px;background:#fff;border-left:1px solid #ddd;overflow-y:auto;padding:1rem}
.meta-panel h3{font-size:.9rem;margin-bottom:.75rem;color:#333}
.field{margin-bottom:.75rem}
.field label{display:block;font-size:.75rem;color:#666;margin-bottom:.25rem;font-weight:600}
.field input[type="text"],.field input[type="number"],.field input[type="date"],.field select,.field textarea{width:100%;padding:.4rem;border:1px solid #ccc;border-radius:4px;font-size:.85rem}
.field textarea{resize:vertical;min-height:60px}
.field .hint{font-size:.7rem;color:#999;margin-top:.15rem}
.field .count{font-size:.7rem;color:#999;text-align:right}
.field-inline{display:flex;align-items:center;gap:.5rem}
.field-inline input[type="checkbox"]{width:auto}
.section-divider{border:0;border-top:1px solid #eee;margin:1rem 0}
.seo-preview{background:#f9f9f9;border:1px solid #ddd;border-radius:4px;padding:.5rem;font-size:.8rem;margin-top:.5rem}
.seo-preview .title{color:#1a0dab;font-size:.95rem}
.seo-preview .url{color:#006621;font-size:.75rem}
.seo-preview .desc{color:#545454;font-size:.8rem}
.status{padding:.5rem 1rem;font-size:.85rem;border-top:1px solid #ddd;background:#fff;display:none}
.status.ok{display:block;background:#e8f5e9;color:#2e7d32}
.status.err{display:block;background:#ffebee;color:#c62828}
/* Media manager modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100}
.modal-overlay.show{display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:8px;width:90vw;max-width:900px;max-height:85vh;display:flex;flex-direction:column}
.modal-header{padding:1rem;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:1.1rem}
.modal-body{flex:1;overflow-y:auto;padding:1rem}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.75rem}
.media-item{border:1px solid #ddd;border-radius:4px;padding:.5rem;cursor:pointer;text-align:center;position:relative}
.media-item:hover{border-color:#1976d2}
.media-item img{max-width:100%;max-height:80px;object-fit:contain}
.media-item .name{font-size:.7rem;color:#666;word-break:break-all;margin-top:.25rem}
.media-item .del{position:absolute;top:.25rem;right:.25rem;background:#c62828;color:#fff;border:0;border-radius:50%;width:1.2rem;height:1.2rem;font-size:.7rem;cursor:pointer;line-height:1}
.media-toolbar{display:flex;gap:.5rem;margin-bottom:1rem;align-items:center}
.media-toolbar input[type="file"]{display:none}
/* Image properties dialog */
.img-dialog .field{margin-bottom:.5rem}
.img-dialog .row{display:flex;gap:.5rem}
.img-dialog .row .field{flex:1}
</style>
</head>
<body>

<nav class="header">
  <a href="/dashboard" class="header__logo">MCP IS</a>
  <div class="header__nav">
    <a href="/dashboard" class="nav-link">Панель</a>
    <a href="/shops" class="nav-link">Магазины</a>
    <a href="/ai-keys" class="nav-link">AI-ключи</a>
    <a href="/settings" class="nav-link">Настройки</a>
    <a href="/admin/users" class="nav-link admin-link" style="display:none">Админ</a>
    <a href="/admin/server" class="nav-link admin-link" style="display:none">Сервер</a>
    <a href="/admin/backup" class="nav-link admin-link" style="display:none">Бэкапы</a>
    <a href="/admin/email" class="nav-link admin-link" style="display:none">Почта</a>
    <a href="/content/admin/" class="nav-link admin-link active" style="display:none">Страницы</a>
  </div>
  <div class="header__user">
    <span id="user-nickname"></span>
    <button type="button" class="btn btn--sm" onclick="app.logout()">Выйти</button>
  </div>
</nav>
<script>
(function(){
  var role = localStorage.getItem('role');
  if (role === 'admin' || role === 'super_admin') {
    document.querySelectorAll('.header .admin-link').forEach(function(el){
      el.style.display = '';
    });
  }
})();
</script>

<div class="toolbar">
  <button onclick="app.newPage('pages')">📄 Новая страница</button>
  <button onclick="app.newPage('news')">📰 Новая новость</button>
  <span class="sep"></span>
  <button class="primary" onclick="app.savePage()">💾 Сохранить</button>
  <button onclick="app.downloadMD()" title="Скачать страницу как .md">⬇ .md</button>
  <button onclick="app.uploadMD()" title="Загрузить .md в редактор">⬆ .md</button>
  <button onclick="app.deletePage()">🗑 Удалить</button>
  <button onclick="app.renamePage()">✏ Переименовать</button>
  <span class="sep"></span>
  <button onclick="app.openMedia()">🖼 Картинки</button>
  <button onclick="app.openImageDialog()">⚙ Свойства картинки</button>
  <span class="sep"></span>
  <button onclick="app.preview()">👁 Просмотр</button>
  <span id="file-label" style="margin-left:auto;font-size:.85rem;color:#666"></span>
</div>

<div class="main">
  <div class="sidebar">
    <h3>Файлы</h3>
    <div class="tree" id="file-tree"></div>
  </div>
  <div class="editor-area">
    <div id="vditor"></div>
  </div>
  <div class="meta-panel">
    <h3>Метаданные</h3>
    <div class="field">
      <label>Заголовок</label>
      <input type="text" id="meta-title" placeholder="Название страницы">
    </div>
    <div class="field-inline">
      <input type="checkbox" id="meta-menu">
      <label for="meta-menu">Показывать в меню</label>
    </div>
    <div class="field">
      <label>Порядок в меню</label>
      <input type="number" id="meta-order" value="0">
    </div>
    <div class="field">
      <label>Дата (для новостей)</label>
      <input type="date" id="meta-date">
    </div>
    <div class="field">
      <label>Изменено</label>
      <input type="date" id="meta-modified">
    </div>
    <div class="field-inline">
      <input type="checkbox" id="meta-draft">
      <label for="meta-draft">Черновик (не публиковать)</label>
    </div>
    <hr class="section-divider">
    <h3>SEO</h3>
    <div class="field">
      <label>Meta title</label>
      <input type="text" id="seo-title" placeholder="Заголовок для поисковиков">
      <div class="count" id="seo-title-count">0 / 60</div>
    </div>
    <div class="field">
      <label>Meta description</label>
      <textarea id="seo-desc" placeholder="Описание для поисковиков (~120-160 символов)"></textarea>
      <div class="count" id="seo-desc-count">0 / 160</div>
    </div>
    <div class="field">
      <label>Robots</label>
      <select id="seo-robots">
        <option value="index, follow">index, follow</option>
        <option value="noindex, follow">noindex, follow</option>
        <option value="index, nofollow">index, nofollow</option>
        <option value="noindex, nofollow">noindex, nofollow</option>
        <option value="nosnippet">nosnippet</option>
      </select>
    </div>
    <div class="field">
      <label>OG image (от корня /media/...)</label>
      <input type="text" id="seo-og-image" placeholder="/media/og-image.jpg">
    </div>
    <div class="field">
      <label>Канонический URL</label>
      <input type="text" id="seo-canonical" placeholder="https://...">
    </div>
    <div class="field">
      <label>Название в крошках</label>
      <input type="text" id="seo-breadcrumb" placeholder="Переопределение">
    </div>
    <div class="seo-preview" id="seo-preview"></div>
    <hr class="section-divider">
    <h3>Раздел (section.json)</h3>
    <div class="field">
      <label>Название раздела</label>
      <input type="text" id="sec-title" placeholder="Для меню и крошек">
    </div>
    <div class="field">
      <label>Порядок раздела</label>
      <input type="number" id="sec-order" value="0">
    </div>
    <div class="field-inline">
      <input type="checkbox" id="sec-menu">
      <label for="sec-menu">Показывать раздел в меню</label>
    </div>
    <button class="primary" onclick="app.saveSection()" style="width:100%;margin-top:.5rem">Сохранить раздел (section.json)</button>
  </div>
</div>

<div class="status" id="status"></div>

<!-- Media manager modal -->
<div class="modal-overlay" id="media-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Картинки</h2>
      <button onclick="app.closeMedia()" style="border:0;background:0;font-size:1.2rem;cursor:pointer">✕</button>
    </div>
    <div class="modal-body">
      <div class="media-toolbar">
        <button onclick="document.getElementById('media-upload').click()">📤 Загрузить</button>
        <input type="file" id="media-upload" accept=".jpg,.jpeg,.png,.webp,.gif" onchange="app.uploadMedia(this)">
        <select id="media-dir" onchange="app.loadMedia()">
          <option value="media">Общий media/</option>
          <option value="_page">Картинки страницы</option>
        </select>
        <input type="text" id="media-filter" placeholder="Фильтр по имени..." oninput="app.filterMedia()" style="margin-left:auto;padding:.4rem;border:1px solid #ccc;border-radius:4px">
      </div>
      <div class="media-grid" id="media-grid"></div>
    </div>
  </div>
</div>

<!-- Image properties dialog -->
<div class="modal-overlay" id="img-modal">
  <div class="modal img-dialog" style="max-width:500px">
    <div class="modal-header">
      <h2>Свойства картинки</h2>
      <button onclick="app.closeImageDialog()" style="border:0;background:0;font-size:1.2rem;cursor:pointer">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>URL картинки</label>
        <input type="text" id="img-src" placeholder="/media/photo.jpg">
      </div>
      <div class="row">
        <div class="field">
          <label>Ширина (px или %)</label>
          <input type="text" id="img-width" placeholder="600">
        </div>
        <div class="field">
          <label>Высота (px или авто)</label>
          <input type="text" id="img-height" placeholder="400">
        </div>
      </div>
      <div class="field">
        <label>Выравнивание</label>
        <select id="img-align">
          <option value="">По умолчанию</option>
          <option value="left">Слева</option>
          <option value="center">По центру</option>
          <option value="right">Справа</option>
        </select>
      </div>
      <div class="field">
        <label>Alt-текст</label>
        <input type="text" id="img-alt" placeholder="Описание картинки">
      </div>
      <button class="primary" onclick="app.applyImageProps()" style="width:100%">Применить</button>
    </div>
  </div>
</div>

<script src="vditor/index.min.js"></script>
<script src="vditor/dist/js/dompurify.min.js"></script>
<script src="contentadmin.js"></script>
</body>
</html>
